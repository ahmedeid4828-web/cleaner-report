<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Utilization Tracker</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    :root {
        --pink: #ff6fa3;
        --white: #ffffff;
    }
    body {
        background-color: var(--white);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
        padding: 20px;
    }
    .container {
        max-width: 1400px;
    }
    .card {
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        padding: 20px;
    }
    h2, h5 { color: var(--pink); }
    label { font-weight: bold; }
    input, select { font-size: 1.1rem; padding: 10px; border-radius: 8px; }
    button {
        font-size: 1.1rem;
        padding: 10px;
        border-radius: 8px;
    }
    .btn-pink { background-color: var(--pink); color: var(--white); }
    .btn-pink:hover { background-color: #e65585; }
    .result-box {
        margin-top: 20px;
        padding: 15px;
        border: 2px solid var(--pink);
        border-radius: 10px;
        background-color: #fff0f6;
        font-size: 1.2rem;
    }
    table th, table td {
        text-align: center;
        vertical-align: middle;
        font-size: 1rem;
    }
    .table thead { background-color: var(--pink); color: var(--white); }
</style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="card text-center">
        <h2>Employee Utilization & Occupation Tracker</h2>
        <p>Upload employee sheet and call data to calculate metrics automatically</p>
    </div>

    <!-- Employee Input -->
    <div class="card">
        <h5>Employee Work Info</h5>
        <div class="row g-3">
            <div class="col-md-3">
                <label for="employeeName">Employee Name</label>
                <input type="text" id="employeeName" class="form-control" placeholder="e.g., Mariam">
            </div>
            <div class="col-md-3">
                <label for="hoursWorked">Hours Worked</label>
                <input type="number" id="hoursWorked" class="form-control" placeholder="e.g., 8">
            </div>
            <div class="col-md-3">
                <label for="breakHours">Break Hours</label>
                <input type="number" id="breakHours" class="form-control" placeholder="e.g., 1">
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button id="calculateBtn" class="btn btn-pink w-100">Calculate Net Hours</button>
            </div>
        </div>
        <div id="resultBox" class="result-box" style="display:none;"></div>
    </div>

    <!-- CSV Upload -->
    <div class="card">
        <h5>Upload Employee Calls CSV</h5>
        <input type="file" id="csvFile" accept=".csv" class="form-control mb-3">
        <button id="uploadBtn" class="btn btn-pink w-100">Upload & Analyze CSV</button>
    </div>

    <!-- Data Table -->
    <div class="card">
        <h5>Employee Metrics</h5>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Hours Worked</th>
                        <th>Break Hours</th>
                        <th>Net Hours</th>
                        <th>Total Call Duration</th>
                        <th>Answer</th>
                        <th>Not Answer</th>
                        <th>Utilization %</th>
                        <th>Occupation %</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody"></tbody>
            </table>
        </div>
        <div class="mt-3 d-flex gap-2">
            <button id="deleteLastBtn" class="btn btn-danger">Delete Last Entry</button>
            <button id="downloadCsvBtn" class="btn btn-success">Download CSV</button>
        </div>
    </div>

</div>

<script>
let employeeData = [];

function updateResultBox() {
    const name = document.getElementById('employeeName').value.trim();
    const worked = parseFloat(document.getElementById('hoursWorked').value);
    const brk = parseFloat(document.getElementById('breakHours').value);
    if(!name || isNaN(worked) || isNaN(brk)) return;
    const net = worked - brk;
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resultBox').innerHTML = `<strong>Net Hours:</strong> ${net.toFixed(2)}`;
}

// Calculate Net Hours
document.getElementById('calculateBtn').addEventListener('click', updateResultBox);

// CSV Upload & Analyze
document.getElementById('uploadBtn').addEventListener('click', function() {
    const fileInput = document.getElementById('csvFile');
    const file = fileInput.files[0];
    if(!file){ alert('Please select a CSV file first'); return; }

    const reader = new FileReader();
    reader.onload = function(e){
        const csv = e.target.result;
        parseCSV(csv);
    }
    reader.readAsText(file);
});

function parseCSV(csv){
    const lines = csv.split(/\r?\n/).filter(l=>l.trim()!=="");
    employeeData = [];
    for(let i=1;i<lines.length;i++){
        const cells = lines[i].split(',');
        if(cells.length < 7) continue;
        const name = cells[0].trim();
        const worked = parseFloat(cells[1]) || 0;
        const brk = parseFloat(cells[2]) || 0;
        const net = worked - brk;
        const totalCall = parseFloat(cells[3]) || 0;
        const answer = parseFloat(cells[4]) || 0;
        const notAnswer = parseFloat(cells[5]) || 0;
        const utilization = net>0 ? ((totalCall + answer*0.083 + notAnswer*0.033)/net)*100 : 0;
        const occupation = net>0 ? ((totalCall + answer*0.083 + notAnswer*0.033)/net)*100 : 0;
        employeeData.push({name, worked, brk, net, totalCall, answer, notAnswer, utilization, occupation});
    }
    renderTable();
}

function renderTable(){
    const tbody = document.getElementById('dataTableBody');
    tbody.innerHTML="";
    employeeData.forEach((e,i)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${e.name}</td>
                        <td>${e.worked}</td>
                        <td>${e.brk}</td>
                        <td>${e.net.toFixed(2)}</td>
                        <td>${e.totalCall}</td>
                        <td>${e.answer}</td>
                        <td>${e.notAnswer}</td>
                        <td>${e.utilization.toFixed(2)}</td>
                        <td>${e.occupation.toFixed(2)}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="deleteEntry(${i})">Delete</button></td>`;
        tbody.appendChild(tr);
    });
}

function deleteEntry(index){
    if(confirm("Are you sure you want to delete this entry?")){
        employeeData.splice(index,1);
        renderTable();
    }
}

// Delete Last Entry
document.getElementById('deleteLastBtn').addEventListener('click', function(){
    if(employeeData.length>0){
        employeeData.pop();
        renderTable();
    }
});

// Download CSV
document.getElementById('downloadCsvBtn').addEventListener('click', function(){
    if(employeeData.length==0){ alert("No data to download"); return; }
    let csv = "Name,Hours Worked,Break Hours,Net Hours,Total Call Duration,Answer,Not Answer,Utilization %,Occupation %\n";
    employeeData.forEach(e=>{
        csv += `${e.name},${e.worked},${e.brk},${e.net.toFixed(2)},${e.totalCall},${e.answer},${e.notAnswer},${e.utilization.toFixed(2)},${e.occupation.toFixed(2)}\n`;
    });
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'employee_metrics.csv';
    a.click();
    URL.revokeObjectURL(url);
});
</script>
</body>
</html>
