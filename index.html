<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justclean - Retention Team Productivity</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {
    --purple: #6f42c1;
    --black: #000000;
    --white: #ffffff;
}
body { background-color: var(--white); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }
.container { max-width: 1200px; margin-top: 20px; }
.card { box-shadow: 0 4px 8px rgba(111,66,193,0.1); border: 1px solid var(--purple); background-color: var(--white); }
.bg-purple { background-color: var(--purple) !important; color: var(--white) !important; }
.text-purple { color: var(--purple) !important; }
.btn-purple { background-color: var(--purple); border-color: var(--purple); color: var(--white); }
.btn-purple:hover { background-color: #5a32a3; border-color: #5a32a3; }
.table thead { background-color: var(--purple); color: var(--white); }
.table-striped tbody tr:nth-of-type(odd) { background-color: #f1eaff; }
.alert { margin-top: 10px; }
#dataTable { margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header bg-purple text-center">
            <h2><i class="fas fa-users"></i> Justclean Retention Team Productivity</h2>
            <p>Enter employee data and upload CSV calls to calculate metrics</p>
        </div>
        <div class="card-body">
            <form id="employeeForm">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="employeeName" class="form-label">Employee Name</label>
                        <input type="text" class="form-control" id="employeeName" placeholder="e.g., Maryam" required>
                    </div>
                    <div class="col-md-4">
                        <label for="hoursWorked" class="form-label">Hours Worked</label>
                        <input type="number" class="form-control" id="hoursWorked" min="0" step="0.5" placeholder="e.g., 9" required>
                    </div>
                    <div class="col-md-4">
                        <label for="breakHours" class="form-label">Break Hours</label>
                        <input type="number" class="form-control" id="breakHours" min="0" step="0.5" placeholder="e.g., 0" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <button type="button" class="btn btn-purple w-100" id="calculateBtn"><i class="fas fa-calculator"></i> Calculate Net Hours</button>
                    </div>
                    <div class="col-md-6">
                        <button type="submit" class="btn btn-purple w-100"><i class="fas fa-save"></i> Save Employee</button>
                    </div>
                </div>
                <div id="netHoursDisplay" class="alert alert-info" style="display:none;">
                    <strong>Net Hours:</strong> <span id="netHours"></span> hours
                </div>
            </form>

            <div class="mt-4">
                <label for="csvFile" class="form-label">Upload Calls CSV</label>
                <input type="file" class="form-control mb-2" id="csvFile" accept=".csv">
                <button type="button" class="btn btn-purple w-100" id="uploadBtn"><i class="fas fa-upload"></i> Upload & Analyze</button>
            </div>

            <div id="uploadResult" class="alert alert-success mt-3" style="display:none;"></div>
            <div id="uploadError" class="alert alert-danger mt-3" style="display:none;"></div>
        </div>
    </div>

    <div class="card mt-4" id="dataTableCard" style="display:none;">
        <div class="card-header bg-purple text-white d-flex justify-content-between align-items-center">
            <h5><i class="fas fa-table"></i> Employees List & Metrics</h5>
            <button class="btn btn-black btn-sm" id="clearAllBtn"><i class="fas fa-trash"></i> Clear All</button>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Hours Worked</th>
                        <th>Break Hours</th>
                        <th>Net Hours</th>
                        <th>Total Call Duration</th>
                        <th>Total Calls</th>
                        <th>Answer</th>
                        <th>Not Answer</th>
                        <th>Utilization %</th>
                        <th>Occupation %</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let employeeData = JSON.parse(localStorage.getItem('employeeData')) || [];
let callData = {}; // {name: {totalDuration, totalCalls, answer, notAnswer}}

function displayTable() {
    const tbody = document.getElementById('dataTableBody');
    tbody.innerHTML = '';
    employeeData.forEach((emp, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${emp.name}</td>
            <td>${emp.hoursWorked}</td>
            <td>${emp.breakHours}</td>
            <td>${emp.netHours}</td>
            <td>${emp.totalDuration.toFixed(2)}</td>
            <td>${emp.totalCalls}</td>
            <td>${emp.answer}</td>
            <td>${emp.notAnswer}</td>
            <td>${emp.utilization.toFixed(2)}</td>
            <td>${emp.occupation.toFixed(2)}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteEmployee(${idx})"><i class="fas fa-trash"></i></button></td>
        `;
        tbody.appendChild(tr);
    });
    document.getElementById('dataTableCard').style.display = employeeData.length ? 'block' : 'none';
}

function deleteEmployee(idx){
    if(confirm('Are you sure you want to delete this employee?')){
        employeeData.splice(idx,1);
        localStorage.setItem('employeeData',JSON.stringify(employeeData));
        displayTable();
    }
}

document.getElementById('calculateBtn').addEventListener('click', () => {
    const name = document.getElementById('employeeName').value.trim();
    const hours = parseFloat(document.getElementById('hoursWorked').value);
    const brk = parseFloat(document.getElementById('breakHours').value);
    if(!name || isNaN(hours) || isNaN(brk) || brk>hours){
        alert('Enter valid data');
        return;
    }
    const net = hours - brk;
    document.getElementById('netHours').textContent = net.toFixed(2);
    document.getElementById('netHoursDisplay').style.display='block';
});

document.getElementById('employeeForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const name = document.getElementById('employeeName').value.trim();
    const hours = parseFloat(document.getElementById('hoursWorked').value);
    const brk = parseFloat(document.getElementById('breakHours').value);
    const net = hours - brk;
    if(!name || isNaN(hours) || isNaN(brk)){ alert('Enter valid data'); return; }
    const existing = employeeData.find(emp=>emp.name.toLowerCase()===name.toLowerCase());
    if(existing){ alert('Employee exists already'); return; }
    employeeData.unshift({
        name, hoursWorked: hours, breakHours: brk, netHours: net,
        totalDuration:0, totalCalls:0, answer:0, notAnswer:0, utilization:0, occupation:0
    });
    localStorage.setItem('employeeData',JSON.stringify(employeeData));
    displayTable();
    document.getElementById('employeeForm').reset();
    document.getElementById('netHoursDisplay').style.display='none';
});

// Upload CSV & calculate metrics with buffer
document.getElementById('uploadBtn').addEventListener('click', ()=>{
    const fileInput = document.getElementById('csvFile');
    const file = fileInput.files[0];
    if(!file){ alert('Select CSV file first'); return; }
    const reader = new FileReader();
    reader.onload = function(e){
        const text = e.target.result;
        const lines = text.split('\n').map(l=>l.trim()).filter(l=>l!=='');
        lines.forEach((line,i)=>{
            if(i===0) return; // skip header
            const cols = line.split(',');
            const name = cols[0].trim();
            const callDuration = parseFloat(cols[1]) || 0;
            const totalCalls = parseInt(cols[2]) || 0;
            const answer = parseInt(cols[3]) || 0;
            const notAnswer = parseInt(cols[4]) || 0;

            const bufferAnswer = answer*0.0833; // 5 min per call
            const bufferNotAnswer = notAnswer*0.0333; // 2 min per call
            const totalDur = callDuration + bufferAnswer + bufferNotAnswer;

            const emp = employeeData.find(e=>e.name.toLowerCase()===name.toLowerCase());
            if(emp){
