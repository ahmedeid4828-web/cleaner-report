<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Utilization Tracker</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --primary-purple: #6a11cb;
  --secondary-purple: #2575fc;
  --light-purple: #e2d9f3;
  --white: #ffffff;
}
body {
  background: linear-gradient(135deg, var(--primary-purple), var(--secondary-purple));
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
}
.container {
  background-color: var(--white);
  padding: 25px 30px;
  border-radius: 15px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  width: 700px;
}
h2 { text-align: center; margin-bottom: 20px; color: var(--primary-purple); }
label { font-weight: 500; margin-top: 10px; }
input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
button { margin-top: 10px; width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; }
button:hover { opacity: 0.9; }
#uploadBtn { background-color: var(--secondary-purple); color: var(--white); }
#deleteBtn { background-color: #dc3545; color: var(--white); }
#downloadBtn { background-color: var(--primary-purple); color: var(--white); }
.result { margin-top: 20px; padding: 15px; background-color: var(--light-purple); border-radius: 10px; font-weight: bold; text-align: center; }
.table-container { margin-top: 20px; max-height: 300px; overflow-y: auto; border: 1px solid #ccc; border-radius: 10px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px; text-align: center; border-bottom: 1px solid #ddd; }
th { background-color: var(--primary-purple); color: var(--white); }
</style>
</head>
<body>
<div class="container">
  <h2>Professional Utilization Tracker</h2>
  <label for="csvFile">Upload CSV File:</label>
  <input type="file" id="csvFile" accept=".csv">
  <button id="uploadBtn">Upload & Analyze</button>
  <button id="deleteBtn">Delete Last Entry</button>
  <button id="downloadBtn">Download Report</button>

  <div class="result" id="result" style="display:none;"></div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Worked Hours</th>
          <th>Break Hours</th>
          <th>Net Hours</th>
          <th>Total Call Duration</th>
          <th>Total Calls</th>
          <th>Answer</th>
          <th>Not Answer</th>
          <th>Utilization %</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>
<script>
let results = [];

function normalizeHeader(header){
  return header.trim().toLowerCase().replace(/\s+/g,'');
}

function processFile(){
  const fileInput = document.getElementById('csvFile');
  const file = fileInput.files[0];
  if(!file){ alert('Please select a CSV file.'); return; }

  const reader = new FileReader();
  reader.onload = function(e){
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim() !== '');
    const rawHeader = lines[0].split(/,|\t/);
    const header = rawHeader.map(normalizeHeader);

    const nameIdx = header.indexOf('name');
    const callDurationIdx = header.indexOf('callduration');
    const callsCountIdx = header.indexOf('callscount');
    const answerIdx = header.indexOf('answer');
    const notAnswerIdx = header.indexOf('notanswer');

    if([nameIdx,callDurationIdx,callsCountIdx,answerIdx,notAnswerIdx].includes(-1)){
      alert('CSV missing required columns.');
      return;
    }

    results = [];

    for(let i=1;i<lines.length;i++){
      const cells = lines[i].split(/,|\t/).map(c=>c.trim());
      if(cells.length<5) continue;

      const name = cells[nameIdx];
      const workedHours = parseFloat(cells[callDurationIdx]) || 0;
      const breakHours = parseFloat(cells[callsCountIdx]) || 0;
      const answer = parseInt(cells[answerIdx]) || 0;
      const notAnswer = parseInt(cells[notAnswerIdx]) || 0;

      const netHours = workedHours - breakHours;
      const totalCallDuration = workedHours + (answer*5/60) + (notAnswer*2/60);
      const utilization = netHours>0 ? (totalCallDuration/netHours)*100 : 0;

      results.push({name, workedHours, breakHours, netHours, totalCallDuration:totalCallDuration.toFixed(2), totalCalls:answer+notAnswer, answer, notAnswer, utilization:utilization.toFixed(2)});
    }

    updateTable();
    fileInput.value='';
    const resDiv = document.getElementById('result');
    resDiv.style.display='block';
    resDiv.innerHTML = `✅ File processed: ${results.length} employee(s)`;
  };
  reader.readAsText(file);
}

function updateTable(){
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML='';
  results.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML=`
      <td>${r.name}</td>
      <td>${r.workedHours}</td>
      <td>${r.breakHours}</td>
      <td>${r.netHours}</td>
      <td>${r.totalCallDuration}</td>
      <td>${r.totalCalls}</td>
      <td>${r.answer}</td>
      <td>${r.notAnswer}</td>
      <td>${r.utilization}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('uploadBtn').addEventListener('click', processFile);
document.getElementById('deleteBtn').addEventListener('click', ()=>{
  if(results.length===0){ alert('No results to delete'); return; }
  results.pop();
  updateTable();
});
document.getElementById('downloadBtn').addEventListener('click', ()=>{
  if(results.length===0){ alert('No results to download'); return; }
  let csv='Name,Worked Hours,Break Hours,Net Hours,Total Call Duration,Total Calls,Answer,Not Answer,Utilization %\n';
  results.forEach(r=>{
    csv+=`${r.name},${r.workedHours},${r.breakHours},${r.netHours},${r.totalCallDuration},${r.totalCalls},${r.answer},${r.notAnswer},${r.utilization}\n`;
  });
  const blob = new Blob([csv],{type:'text/csv'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'utilization_report.csv';
  link.click();
});
</script>
</body>
</html>
