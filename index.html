<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utilization Calculator</title>
<style>
body {
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #6a11cb, #2575fc);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.container {
  background: #fff;
  padding: 25px 30px;
  border-radius: 15px;
  box-shadow: 0px 6px 15px rgba(0,0,0,0.15);
  width: 600px;
}
h2 { text-align: center; margin-bottom: 20px; color: #333; }
label { display: block; margin: 10px 0 5px; }
input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 8px; }
button { margin-top: 10px; width: 100%; padding: 10px; background: #2575fc; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
button:hover { background: #1b5edb; }
.result { margin-top: 20px; font-size: 16px; text-align: center; font-weight: bold; color: #333; background: #f7f7f7; padding: 15px; border-radius: 10px; }
.table-container { margin-top: 20px; max-height: 300px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; }
table, th, td { border: 1px solid #ccc; }
th, td { padding: 8px; text-align: center; }
th { background-color: #6a11cb; color: #fff; }
</style>
</head>
<body>
<div class="container">
  <h2>Utilization Calculator</h2>
  <label for="csvFile">Upload CSV/Excel:</label>
  <input type="file" id="csvFile" accept=".csv">

  <button onclick="processFile()">Analyze & Calculate</button>
  <button onclick="deleteLast()">🗑 Delete Last</button>
  <button onclick="downloadReport()">⬇️ Download Report</button>

  <div class="result" id="result"></div>

  <div class="table-container">
    <table id="dataTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Worked Hours</th>
          <th>Break Hours</th>
          <th>Net Hours</th>
          <th>Total Call Duration</th>
          <th>Total Calls</th>
          <th>Answer</th>
          <th>Not Answer</th>
          <th>Utilization %</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
let results = [];

function processFile() {
  const fileInput = document.getElementById('csvFile');
  const file = fileInput.files[0];
  if(!file){ alert('Please select a CSV file.'); return; }

  const reader = new FileReader();
  reader.onload = function(e){
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim() !== '');
    const header = lines[0].split(/,|\t/).map(h=>h.trim());

    const nameIdx = header.indexOf('Name');
    const callDurationIdx = header.indexOf('Call Duration');
    const callsCountIdx = header.indexOf('Calls Count');
    const answerIdx = header.indexOf('Answer');
    const notAnswerIdx = header.indexOf('Not Answer');

    if([nameIdx, callDurationIdx, callsCountIdx, answerIdx, notAnswerIdx].includes(-1)){
      alert('CSV missing required columns.'); return;
    }

    results = [];
    for(let i=1;i<lines.length;i++){
      const cells = lines[i].split(/,|\t/).map(c=>c.trim());
      if(cells.length<5) continue;

      const name = cells[nameIdx];
      const workedHours = parseFloat(cells[callDurationIdx]) || 0;
      const breakHours = parseFloat(cells[callsCountIdx]) || 0;
      const answer = parseInt(cells[answerIdx]) || 0;
      const notAnswer = parseInt(cells[notAnswerIdx]) || 0;

      const netHours = workedHours - breakHours;
      let totalCallDuration = workedHours; // default if no data
      totalCallDuration += (answer*5/60); // 5 mins buffer
      totalCallDuration += (notAnswer*2/60); // 2 mins buffer

      const utilization = netHours>0 ? (totalCallDuration/netHours)*100 : 0;

      const obj = {name, workedHours, breakHours, netHours, totalCallDuration:totalCallDuration.toFixed(2), totalCalls:answer+notAnswer, answer, notAnswer, utilization:utilization.toFixed(2)};
      results.push(obj);
    }
    updateTable();
    fileInput.value='';
  };
  reader.readAsText(file);
}

function updateTable(){
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML='';
  results.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML=`
      <td>${r.name}</td>
      <td>${r.workedHours}</td>
      <td>${r.breakHours}</td>
      <td>${r.netHours}</td>
      <td>${r.totalCallDuration}</td>
      <td>${r.totalCalls}</td>
      <td>${r.answer}</td>
      <td>${r.notAnswer}</td>
      <td>${r.utilization}</td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('result').innerHTML='✅ File processed successfully!';
}

function deleteLast(){
  if(results.length===0){ alert('No results to delete'); return; }
  results.pop();
  updateTable();
}

function downloadReport(){
  if(results.length===0){ alert('No results to download'); return; }
  let csv='Name,Worked Hours,Break Hours,Net Hours,Total Call Duration,Total Calls,Answer,Not Answer,Utilization %\n';
  results.forEach(r=>{
    csv+=`${r.name},${r.workedHours},${r.breakHours},${r.netHours},${r.totalCallDuration},${r.totalCalls},${r.answer},${r.notAnswer},${r.utilization}\n`;
  });
  const blob = new Blob([csv],{type:'text/csv'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'utilization_report.csv';
  link.click();
}
</script>
</body>
</html>
